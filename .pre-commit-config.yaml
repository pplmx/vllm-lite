fail_fast: true
default_install_hook_types:
    - pre-commit
    - commit-msg
    - pre-push
default_stages:
    - pre-commit
repos:
    # Built-in file hygiene checks. Cheap; safe to run unconditionally.
    - repo: builtin
      hooks:
          - id: end-of-file-fixer
          - id: trailing-whitespace
            exclude: \.md$
          - id: check-toml
          - id: check-yaml
            # Helm chart templates embed Go template syntax (`{{ ... }}`)
            # which is not parseable as plain YAML; check the rendered
            # output instead (helm template in CI / `just` recipes).
            exclude: ^k8s/charts/.*/templates/.*\.ya?ml$
          - id: check-merge-conflict
          - id: mixed-line-ending
            args: ["--fix=lf"]
          - id: check-added-large-files
            args: ["--maxkb=512"]
          - id: check-case-conflict

    # Conventional commit messages (commit-msg hook).
    - repo: https://github.com/commitizen-tools/commitizen
      rev: v4.16.5
      hooks:
          - id: commitizen
          - id: commitizen-branch
            stages: [pre-push]

    # Markdown lint + format.
    - repo: https://github.com/rvben/rumdl-pre-commit
      rev: v0.2.43
      hooks:
          - id: rumdl
            args: [--fix]
          - id: rumdl-fmt # Pure format, always exits 0

    # Rust toolchain checks — pre-commit local-only.
    # These mutate the working tree when fixes are applied; downstream hooks
    # re-stage changes. We only invoke the *check* variants on commit; the
    # heavier `just quick` runs on pre-push (configured separately).
    - repo: local
      hooks:
          - id: cargo-fmt-check
            name: cargo fmt --check
            entry: cargo fmt --all -- --check
            language: system
            types: [rust]
            stages: [pre-commit]

          - id: cargo-clippy-check
            # Tiered deny matching CI exactly (see justfile `clippy`).
            name: cargo clippy (deny correctness/suspicious/perf)
            entry: >
              bash -c 'cargo clippy --all-targets --workspace --all-features --
              -D clippy::correctness
              -D clippy::suspicious
              -D clippy::perf'
            language: system
            types: [rust]
            # pre-push only — too slow to gate every commit.
            stages: [pre-push]
            pass_filenames: false

          # Dependency auditing is deliberately NOT a pre-push hook.
          #
          # It gates on the state of the whole lockfile rather than on what is
          # being pushed, so a RustSec advisory published against a crate this
          # branch never touched blocks every push — which is exactly what
          # happened on 2026-11-23: 16 advisories against a lockfile that had
          # not changed since origin/main, and the only escape was `--no-verify`.
          # A gate whose failure says nothing about the commit being pushed
          # trains people to bypass gates.
          #
          # It runs where that signal belongs: `.github/workflows/ci.yml`
          # (`cargo audit`), `.github/workflows/deny.yml` (`cargo deny check`)
          # and `just audit` / `just deny` locally.
