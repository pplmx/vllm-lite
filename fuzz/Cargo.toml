[package]
name = "vllm-fuzz"
version = "0.1.0"
publish = false
edition = "2024"
# MSRV matches the workspace root (Cargo.toml) and `rust-toolchain.toml`.
# Bump together with the rest of the toolchain policy.
rust-version = "1.88"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde-saphyr = "0.0.27"
serde = { version = "1", features = ["derive"] }
safetensors = "0.7.0"
tiktoken = "3"

[dependencies.vllm-core]
path = "../crates/core"

[dependencies.vllm-server]
path = "../crates/server"

[dependencies.vllm-model]
path = "../crates/model"

[dependencies.serde_json]
version = "1"

# `fuzz` is excluded from the root workspace (`exclude = ["fuzz"]` in
# Cargo.toml), so `[lints] workspace = true` cannot resolve a workspace
# root here — cargo errors with "failed to find a workspace root" and
# every `cargo +nightly fuzz` invocation (including `just fuzz-build`
# and the fuzz-nightly CI job) fails at manifest parse time. Fuzz
# targets are libFuzzer harnesses built only via cargo-fuzz; they do
# not need the workspace's clippy/rustc lint tiers, so no lint
# inheritance is declared.

# cargo-machete can't see usage from the generated fuzz target binaries
# (each `[[bin]]` is a separate compilation unit and the references live
# in fuzz_targets/*.rs). `serde` is used by `#[derive(Serialize, Deserialize)]`
# on shared types; `vllm-core` is referenced by the fuzz target entry points.
[package.metadata.cargo-machete]
ignored = ["serde", "vllm-core"]

[[bin]]
name = "app_config_yaml"
path = "fuzz_targets/app_config_yaml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "safetensors_header"
path = "fuzz_targets/safetensors_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qwen3_config_json"
path = "fuzz_targets/qwen3_config_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tokenizer_decode"
path = "fuzz_targets/tokenizer_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gguf_header"
path = "fuzz_targets/gguf_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "openai_http_request"
path = "fuzz_targets/openai_http_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "completions_http_request"
path = "fuzz_targets/completions_http_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "batch_json_input"
path = "fuzz_targets/batch_json_input.rs"
test = false
doc = false
bench = false
