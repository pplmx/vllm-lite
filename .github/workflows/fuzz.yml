name: Fuzz Smoke

# Run a short fuzz-smoke against every fuzz target on every PR.
# Wall-clock budget: ~5-7 min total (8 targets × 30s + setup + build).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CUDARC_CUDA_VERSION: '12090'

  # husky-rs dev-dep auto-installs hooks; CI has no prek (see pplmx/husky-rs#20)
  NO_HUSKY_HOOKS: '1'

jobs:
  fuzz-smoke:
    name: Fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [app_config_yaml, batch_json_input, completions_http_request, gguf_header, openai_http_request, qwen3_config_json, safetensors_header, tokenizer_decode]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-fuzz-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-cargo-

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install cargo-fuzz
        # cargo-fuzz must live in the nightly toolchain that `cargo +nightly
        # fuzz` uses. The cargo cache may already restore the binary, so
        # skip installation when the subcommand is available.
        run: |
          if ! cargo +nightly fuzz --help >/dev/null 2>&1; then
            cargo +nightly install cargo-fuzz --locked
          fi

      - name: Build fuzz targets
        run: just fuzz-build

      - name: Cache fuzz corpus
        uses: actions/cache@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz ${{ matrix.target }} (30s)
        run: cargo +nightly fuzz run ${{ matrix.target }} --fuzz-dir fuzz -- -max_total_time=30

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: |
            fuzz/artifacts/
            fuzz/corpus/${{ matrix.target }}/
          if-no-files-found: ignore
