name: MSRV Check

# Verify the workspace compiles against the project's stated Minimum Supported
# Rust Version (1.94 — see Cargo.toml [workspace.package].rust-version).
# Triggered on push to main + PRs; cheap (~2-3 min) thanks to the shared cache.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CANDLE_NATIVE_BACKEND: 1
  CUDARC_CUDA_VERSION: '12090'
  # candle-kernels probes nvidia-smi to pick a compute cap; GitHub
  # runners have no GPU. Pin a generic compute capability so CUDA
  # kernels compile (no GPU needed at build time).
  CUDA_COMPUTE_CAP: '90'

  # husky-rs dev-dep auto-installs hooks; CI has no prek (see pplmx/husky-rs#20)
  NO_HUSKY_HOOKS: '1'

jobs:
  msrv:
    name: Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.94"]  # MSRV; expand here when bumped
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Install CUDA toolkit (nvcc for candle-kernels)
        # `--all-features` compiles candle-kernels, whose build script
        # requires nvcc to build the CUDA kernels. Compiling CUDA needs
        # only the toolkit (no GPU/driver), so apt's toolkit suffices.
        run: |
          sudo apt-get update
          sudo apt-get install -y nvidia-cuda-toolkit
          nvcc --version

      - name: Install protoc (vllm-dist build.rs)
        # vllm-dist's build script compiles the gRPC proto; GitHub
        # runners don't ship protobuf-compiler.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: "."
          shared-key: "msrv"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Check (no run)
        # We only verify the workspace compiles cleanly under MSRV;
        # running tests under MSRV is intentionally out of scope to keep
        # CI cost low. Add `cargo nextest run` here if MSRV regressions
        # in test code start being a problem.
        run: cargo check --workspace --all-features --all-targets

      - name: MSRV drift guard
        # The MSRV is declared in FOUR places. Checking only `Cargo.toml`
        # against the matrix lets the others drift silently — `Dockerfile`
        # would still build on an older image, and `fuzz/` would claim a
        # different minimum than the workspace it fuzzes. This guard was
        # widened after the 1.88 -> 1.94 bump, which had to touch all of them
        # by hand.
        run: |
          expected="${{ matrix.rust }}"
          status=0
          check() {
            if [ "$2" != "$expected" ]; then
              echo "::error::$1 says $2, but the MSRV matrix says $expected"
              status=1
            else
              echo "ok  $1 = $2"
            fi
          }
          check "Cargo.toml rust-version" \
            "$(grep '^rust-version' Cargo.toml | head -1 | awk -F'"' '{print $2}')"
          check "rust-toolchain.toml channel" \
            "$(grep '^channel' rust-toolchain.toml | awk -F'"' '{print $2}')"
          check "fuzz/Cargo.toml rust-version" \
            "$(grep '^rust-version' fuzz/Cargo.toml | awk -F'"' '{print $2}')"
          check "Dockerfile builder image" \
            "$(grep -m1 '^FROM rust:' Dockerfile | sed -E 's/^FROM rust:([0-9.]+)-.*/\1/')"
          exit $status
