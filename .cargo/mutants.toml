# cargo-mutants configuration.
#
# `exclude_re` entries are mutations this tree has ALREADY classified as
# equivalent: the mutated code and the original produce identical observable
# behaviour, so no test can distinguish them and reporting them nightly is pure
# noise. Each entry names where its justification lives. Do NOT add one without
# that evidence — excluding a real gap silently lowers the score.
#
# Full reasoning per entry: docs/mutation-equivalents.md.
# Line numbers are deliberately part of each pattern so an accidental
# reclassification after a refactor fails loudly (no match) instead of silently
# widening the exclusion.

exclude_re = [
  # `keep = matched - stop_len`, so equality yields keep == 0: the whole burst
  # is dropped and nothing survives to be held back, making the flag moot.
  'dispatch\.rs:527:57: replace > with >=',

  # The outer `total_draft > 0` duplicates the callee's own `if total > 0`
  # guard in `record_speculative_acceptance`.
  'dispatch\.rs:164:24: replace > with >=',

  # `ensure_blocks_for_tokens` no-ops when the count already matches, so calling
  # it on equality changes nothing.
  'dispatch\.rs:565:44: replace < with <=',

  # Only reachable at `elapsed == 0`, where both variants skip the sample.
  'graph_step\.rs:280:20: replace > with >=',

  # The verifier's bounds guard cannot trigger: measured `end` maxes out at
  # `logits_len - vocab`, so `>` and `>=` agree everywhere.
  'verify\.rs:179:40: replace > with >=',

  # `min(cap, cap) == cap`: the exactly-one-chunk case returns the same count
  # through either branch.
  'prefill\.rs:168:37: replace > with >=',

  # `if elapsed > 0.0` on the non-graph step path: same reason as graph_step's.
  'dispatch\.rs:227:20: replace > with >=',

  # `running` holds only Decoding sequences when this filter runs:
  # `requeue_partial_prefills` moves every partial prefill back to the queue,
  # and `build_batch` preempts before admitting new sequences.
  'memory\.rs:107:63: replace == with !=',

  # The queued branch of `cancel_request`; a queued request owns no blocks, so
  # the inverted guard skips a no-op. (The running branch is NOT equivalent.)
  'memory\.rs:251:16: delete !',

  # Callers only enter with `additional > available` and a whole-table
  # `blocks_needed`, so exact equality is unreachable from the production path.
  'memory\.rs:62:57: replace < with <=',

  # `total` is a sum of `probs[..cutoff]`, and `probs[0]` is
  # `exp(max - max) / sum = 1/sum > 0` whenever `max_val` is finite, so the
  # `total == 0` case the `>=` variant reaches never occurs.
  'sampling\.rs:178:31: replace > with >= in renormalized_top_p_logprobs',

  # At `p_norm == 0` the `>` branch yields `-inf` from the else arm and the
  # `>=` branch yields `0.0_f32.ln() == -inf`; identical.
  'sampling\.rs:179:35: replace > with >= in renormalized_top_p_logprobs',

  # `(temperature - 1.0).abs() > EPSILON` guards a division BY the temperature.
  # Replacing `-` with `+` or `/` makes the guard true at `T == 1.0`, where the
  # division is by 1.0 and changes nothing; for every other T the guard was
  # already true, so the work performed is identical.
  'sampling\.rs:372:50: replace - with \+ in sample_batch',
  'sampling\.rs:372:50: replace - with / in sample_batch',

  # Differs only at `|T - 1| == f32::EPSILON`, where both branches divide by a
  # temperature within one f32 ulp of 1.0 - unobservable in the result.
  'sampling\.rs:372:63: replace > with >= in sample_batch',

  # `(repeat_penalty - 1.0).abs() > EPSILON` guards a division BY the penalty.
  # Replacing `-` with `+` or `/` makes the guard true at `penalty == 1.0`,
  # where `apply_repeat_penalty` divides by 1.0 and changes nothing; for every
  # other penalty the original guard was already true.
  'sampling\.rs:368:32: replace - with \+ in sample_batch',
  'sampling\.rs:368:32: replace - with / in sample_batch',

  # Differs only at `|penalty - 1| == f32::EPSILON`, a penalty within one f32
  # ulp of 1.0, where the division cannot move the result.
  'sampling\.rs:368:45: replace > with >= in sample_batch',

  # `||` opens two paths that were closed: (empty history, any penalty) makes
  # `apply_repeat_penalty` iterate nothing, and (non-neutral penalty,
  # penalty == 1.0) divides by 1.0. Both are no-ops.
  'sampling\.rs:368:60: replace && with \|\| in sample_batch',

  # `now.duration_since(created_at) > request_timeout`: `>=` differs only at
