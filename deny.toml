# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/)
#
# Run locally:  cargo deny check
# Wire into CI:  just deny   (see justfile)
#
# This file enforces:
#   * License whitelist aligned with vLLM-lite's MIT license (compatible only)
#   * Ban duplicate crate versions in the dependency graph
#   * Ban known-bad sources (git deps, non-crates.io URLs without allowlist)
#   * Surface RUSTSEC advisories (paste INFO advisory is allow-listed with rationale)
#
# See SECURITY.md "Audit History" for the paste disposition.

[graph]
# All targets incl. dev-dependencies, benches, examples, tests
all-features = true
no-default-features = false

[advisories]
# Fetch the latest RustSec advisory database on every run.
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# Report UNMAINTAINED advisories for transitive crates too. The crate default
# is `workspace`, which silently drops them — the `paste` ignore below then
# matched nothing (`advisory-not-detected`) and the config claimed coverage it
# did not have.
unmaintained = "all"
ignore = [
  # RUSTSEC-2024-0436 — `paste` crate is unmaintained. INFO severity (no
  # vulnerability, no patch). Deep transitive via gemm → candle-core.
  # No candle-core release removes the paste dependency (verified v27.0).
  # Tracked as accepted risk; see SECURITY.md.
  "RUSTSEC-2024-0436",
]

[licenses]
# Allowlist aligned with MIT-compatible licenses.
# Only licenses that actually occur in the graph. `cargo-deny` reports an
# unmatched entry as `license-not-encountered`, which is how `OpenSSL`,
# `MPL-2.0` and `OpenSSL`/`0BSD` sat here unnoticed: the graph contains no
# crate under those terms, so the entries widened the allowlist without
# protecting anything. Re-add one only together with the crate that needs it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.8

# Some transitive deps carry non-standard license strings we accept.
# Each entry maps crate name -> the extra licenses allowed for that crate.
#
# Every entry here must correspond to a crate that is ACTUALLY in the graph:
# `cargo-deny` accepts an exception for an absent crate silently, so a removed
# dependency leaves the permission behind. `rustls-pemfile` and `cpp_demangle`
# used to be listed and are both gone; re-add with the crate or not at all.
exceptions = [
    # aws-lc-sys: a long AND chain including MIT-0, which the global allowlist
    # now carries directly. Its `(Apache-2.0 OR ISC OR MIT-0)` disjunction needs
    # MIT-0 to be allowed, hence the entry.
    {
        name = "aws-lc-sys",
        allow = ["Apache-2.0", "ISC", "MIT", "MIT-0", "BSD-3-Clause"],
    },
    # ryu is `Apache-2.0 OR BSL-1.0`; Apache-2.0 already satisfies it, so no
    # entry is needed. Kept out rather than allowed broadly.
]

[bans]
# Multiple versions of the same crate waste compile time and risk subtle bugs.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "warn"
external-default-features = "allow"

# Banned crates — pull these out if you see them in `cargo tree`.
deny = [
    # Use `jsonwebtoken` / `rustls` instead. Kept as a guard even though the
    # graph does not contain `openssl` today: a future dependency would pull a
    # second TLS stack and its own C toolchain in.
    { name = "openssl" },
]
skip = [
    # `openssl-sys` and `aws-lc-sys` used to be skipped here. Both entries went
    # stale: `openssl-sys` is no longer in the graph at all (the ban above still
    # guards against it), and `aws-lc-sys` now resolves to a single version, so
    # the skip only produced an `unnecessary-skip` warning.
]
skip-tree = []

[sources]
# Only allow crates.io by default. Vendored and git deps need explicit allow.
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
